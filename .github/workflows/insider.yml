name: Insider data — collect + enrich (daily)

# 내부자 거래(insider_trades) 자동 누적 — Form 4 클러스터 매수신호의 알파는 공시 직후 수일이 가장 강하다.
# 주1회 배치는 그 best window 를 구조적으로 버리므로 daily 로 돌린다.
# - Form 4 자체가 T+2 공시라 인트라데이는 한계효용 급감 → 일 1회가 sweet spot(지연 T+2 + 최대 1일 ≈ 3일).
# - 수집: Finnhub per-symbol(워치리스트 = 의회거래종목 ∪ S&P500). 멱등: external_id(= fin:<accession>:<sym>:
#   <code>:<date>:<change>) + uniq_itrade_ext + onConflictDoNothing. 운영 검증: 기존 주간배치가 --days 14
#   (7일 겹침)인데도 중복 external_id 0 → 겹침-증분 안전. joint-filer/교차티커 dedup 은 query-time 이라 무관.
# - PTR(정치인)은 최대 45일 지연이라 weekly 로 충분 → congress.yml 과 비대칭 주기(소스별 신선도에 맞춤).
#
# ⚠️ GitHub schedule 트리거는 기본 브랜치(master)에서만 실행됨. Secrets: DATABASE_URL, FINNHUB_API_KEY

on:
  schedule:
    # 매일 03:00 UTC (≈ 22:00 EST / 23:00 EDT, EDGAR 마감 22:00 ET 직후). Finnhub 수집 지연은 --days 7 겹침이 흡수.
    - cron: "0 3 * * *"
  workflow_dispatch: {} # 수동 실행 버튼

concurrency:
  group: insider-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # npm ci 대신 npm install: lock 에 플랫폼별 optional 의존성(bufferutil 등)이 불완전해
      # ubuntu 러너에서 npm ci(엄격 동기화)가 실패함. npm install 은 그 불일치를 흡수해 견고.
      - run: npm install --no-audit --no-fund
      - name: Collect insider (Finnhub, last 7 days) + enrich
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          npm run collect:insider -- --days 7
          npm run enrich:tickers
          npm run enrich:insider-roles
          npm run enrich:10b5
          npm run enrich:holdings

      # #27 — 수집·보강 직후 데이터 정합 모니터. orphan B(진짜 링크깨짐)>0 면 step 실패(RED)로 알림.
      - name: Healthcheck (insider 정합 모니터 #27)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run healthcheck
