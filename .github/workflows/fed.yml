name: Fed balance sheet — collect + verify

# Fed 대차대조표(H.4.1) + 재무부 국채(MSPD) 수집. 키 없는 공개 CSV/JSON — Secret 은 DATABASE_URL 뿐.
# 단일 주간 리듬(연준 기준): 매주 목요일 H.4.1 발표 직후 1회. upsert 라 재실행 멱등.
#   - 페이지에 그려지는 데이터는 전부 주간 H.4.1(연준) + 월간 MSPD(재무부) 뿐 → 일간 크론 불필요(제거).
#   - MSPD 는 재무부가 '월간'만 공개하지만 매주 돌려도 멱등(새 달 없으면 무변화) → 월초 발표분을 그 주 목요일에 자동 반영.
#   - (미래에 일간 순유동성 차트를 붙이면 run 블록에 `--only daily --recent 10` 한 줄 추가)
# 수집 직후 fed:verify(F1~F6) 로 게이트 — 단위/항등식/네거티브컨트롤 깨지면 job 실패(RED).
#
# ⚠️ GitHub schedule 트리거는 기본 브랜치에서만 실행됨 — 이 파일이 병합돼야 정기 실행 시작.
#    필요한 레포 Secret: DATABASE_URL

on:
  schedule:
    - cron: "30 22 * * 4"   # 주간: 목 22:30 UTC (H.4.1 목 16:30 ET 발표 후, EDT/EST 연중 안전)
  workflow_dispatch: {}

concurrency:
  group: fed-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      # 주간 리듬: 연준 H.4.1(전 지표, 최근 5주 재요청=수정치 반영) + 재무부 MSPD(새 달 있으면 반영) + 검증.
      - name: Collect H.4.1 + MSPD + verify
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm run fed:backfill -- --only weekly --recent 35   # 연준 H.4.1
          npm run fed:backfill -- --only mspd   --recent 70    # 재무부 MSPD(국채 종류별 잔액, 멱등)
          npm run fed:verify
